                         data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">

        </div><!-- container - конец -->

    <main class="container">
        <h1>Лабораторная работа 1</h1>

        <h3>Список</h3>
        <ol type="A">
            <li>элемент 1 списка</li>
            <li>элемент 2 списка</li>
        </ol>
        <hr />

        <h2>Форма</h2>
        <!-- п. 2.7: для проверки в Developer tools замените method="get" на method="post" -->
        <form method="get">
            <div class="row mb-3">
                <div class="col-sm-10 offset-sm-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="chk1" name="chk1" />
                        <label class="form-check-label" for="chk1">Чек-бокс 1</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="chk2" name="chk2" />
                        <label class="form-check-label" for="chk2">Чек-бокс 2</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-10 offset-sm-2">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio1" name="radio" value="1" checked />
                        <label class="form-check-label" for="radio1">Радио-1</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio2" name="radio" value="2" />
                        <label class="form-check-label" for="radio2">Радио-2</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio3" name="radio" value="3" />
                        <label class="form-check-label" for="radio3">Радио-3</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="login" class="col-sm-2 col-form-label">Логин:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="login" name="login" placeholder="Введите имя" />
                </div>
            </div>

            <div class="row mb-3">
                <label for="pass" class="col-sm-2 col-form-label">Пароль:</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" id="pass" name="pass" placeholder="Введите пароль" />
                </div>
            </div>

            <button type="submit" class="btn btn-info text-white">Отправить</button>
        </form>
    </main>

    <footer class="fixed-bottom">
        <div class="container">
            <div class="navbar navbar-dark navbar-expand-md">

                        <i class="fab fa-twitter fa-2x"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="lib/jquery/dist/jquery.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
